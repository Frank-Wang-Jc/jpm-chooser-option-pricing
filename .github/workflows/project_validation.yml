name: Project validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate notebooks and required deliverables
        run: python .github/scripts/validate_repository.py

  application-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Week 8/pricing_tool/requirements.txt

      - name: Install application dependencies
        run: python -m pip install --disable-pip-version-check -r "Week 8/pricing_tool/requirements.txt"

      - name: Run pricing-engine and Streamlit smoke tests
        run: python .github/scripts/smoke_test_app.py
